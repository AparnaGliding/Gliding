<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AssistQ Chat Icon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      overflow: hidden;
    }

    .assistq-chat-icon {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1055;
      transition: transform 0.2s ease;
    }

    .assistq-chat-icon:hover {
      transform: scale(1.1);
    }

    .assistq-chat-icon:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>
  <div class="assistq-chat-icon" role="button" onclick="openWidget()">
    <svg xmlns="http://www.w3.org/2000/svg"
         width="32"
         height="32"
         fill="#2c5aa0"
         viewBox="0 0 24 24">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4l4 4 4-4h4c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
    </svg>
  </div>

  <script>
    console.log('Chat icon loaded');

    function openWidget() {
      console.log('Chat icon clicked - sending OPEN_WIDGET message');
      window.parent.postMessage(
        { type: 'OPEN_WIDGET' },
        '*'
      );
    }
  </script>
</body>
</html>
