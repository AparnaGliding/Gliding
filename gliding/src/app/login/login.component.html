<div class="background">
  <div class="row align-items-center justify-content-center h-100 w-100">
    <div class="col-xxl-5 rounded">
      <div class="title mb-3">
        Gliding
      </div>
      <div class="login-container p-5">
        <div class="form-group mb-4">
          <label for="username" class="form-label mb-2">Email Address</label>
          <input
            type="text"
            pInputText
            id="username"
            name="username"
            class="w-100"
            placeholder="Enter your Username"
            [(ngModel)]="username" />
        </div>

        <div class="form-group mb-4">
          <label for="password" class="form-label mb-2">Password</label>
          <input
            type="password"
            pInputText
            id="password"
            name="password"
            class="w-100"
            placeholder="Enter your Password"
            [(ngModel)]="password" />
        </div>

        <p-button label="Submit" severity="primary" styleClass="w-100"></p-button>
      </div>
    </div>
  </div>
</div>
