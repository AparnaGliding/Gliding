<header class="app-header bg-white border-b border-gray-200 fixed top-0 left-0 right-0 z-50">
  <div class="header-inner">
    <!-- Left: Logo -->
    <a routerLink="/apps" class="brand">
      <div class="brand-icon">A</div>
      <span class="brand-text">AssistQ</span>
    </a>

    <!-- Middle: Optional App Dropdown (only for app-detail) -->
    <div class="app-switcher" *ngIf="showAppDropdown">
      <button class="app-switcher-btn">
        <span class="current-app">SaaS Platform Docs</span>
        <i class="pi pi-angle-down"></i>
      </button>
    </div>

    <!-- Right: Nav -->
    <nav class="nav">
      <a routerLink="/apps" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        <i class="pi pi-th-large"></i>
        <span>My Applications</span>
      </a>
      <a routerLink="/admin" routerLinkActive="active" class="nav-link">
        <i class="pi pi-cog"></i>
        <span>Admin</span>
      </a>
      <a href="#" class="nav-link">
        <i class="pi pi-question-circle"></i>
        <span>Help</span>
      </a>
      <a href="/login" class="nav-link">
        <i class="pi pi-user"></i>
        <span>Login</span>
      </a>
    </nav>
  </div>
</header>
