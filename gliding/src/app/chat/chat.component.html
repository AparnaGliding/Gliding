<div class="d-flex main-container">
  <div class="left-container bg-white">
    <div class = "pb-3">
    <p-button styleClass="blue w-100"  icon = "pi pi-plus" label="New Conversation"></p-button>
    </div>
    <div class="gap-2">
      <div class="text-secondary fw-medium mb-2 ">
        Your Conversations
      </div>
        @for (history of chatHistory; track history.chatId) {
          <div >
           <div class = "fw-medium heading-text fs-6" >
         {{history.title}}
             </div>
          <div class = "fw-light text-secondary">
            {{history.modifiedAt}}
          </div>
          </div>
        }

    </div>
  </div>
  <div class="middle-container d-flex flex-column overflow-y-auto">
    <div class =  "flex-fill p-4">
    <h3>Chat Messages</h3>
    </div>
    <div class="bg-white p-4 shadow border-top border-bottom d-flex align-items-center">
      <div class="flex-fill me-3">
        <input pInputText type="text" placeholder="Ask me about your product..." class="w-100 rounded p-3"/>
      </div>
      <div>
        <p-button icon="pi pi-send" styleClass="send-button blue"></p-button>
      </div>
    </div>

    </div>

  <div class="right-container default-border bg-white">
    <h4>Chat Info</h4>

  </div>
</div>
